    <div id="rotate-overlay" style="
        display:none;
        position:fixed; inset:0; z-index:99999;
        background:#fff;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        font-family:'Noto Sans KR',sans-serif;
        color:#444;
        gap:20px;
        text-align:center;
        padding:32px;
    ">
        <img id="rotate-icon" src="icons/arrows-counter-clockwise.svg" style="width:56px;height:56px;opacity:0.5;" />
        <div id="rotate-message" style="font-size:1rem;font-weight:400;line-height:1.7;color:#555;"></div>
    </div>

    <style>
        /* 회전 오버레이: JS가 isTablet 판단 후 class 추가로 제어 */
        #rotate-overlay.show { display: flex !important; }

        /* 🧶 새로 추가된 부드러운 뜨개 감성 스피너 애니메이션 */
        /* 🧶 말차 라떼 감성의 스피너 애니메이션 */
        .knit-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #DCE3D5;
            border-bottom-color: #768A6B;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: knit-rotation 1s linear infinite;
        }

        @keyframes knit-rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        (function () {
            var overlay = document.getElementById('rotate-overlay');
            var msg     = document.getElementById('rotate-message');

            function updateOverlay() {
                // 물리 픽셀 기준 긴 쪽으로 태블릿 여부 판단 (devicePixelRatio 고려)
                var dpr = window.devicePixelRatio || 1;
                var cssW = window.innerWidth;
                var cssH = window.innerHeight;
                var longerCss = Math.max(cssW, cssH);

                // 태블릿: 긴 CSS px 기준 1024px 이상 (아이패드 10 = 820×1180) 갤럭시 때문에 1024로 변경
                var isTablet = longerCss >= 1024;
                var isPortrait = cssH > cssW;

                var shouldShow = isTablet ? isPortrait : !isPortrait;

                if (shouldShow) {
                    msg.textContent = isTablet ? '가로 모드로 회전해주세요' : '세로 모드로 회전해주세요';
                    overlay.classList.add('show');
                } else {
                    overlay.classList.remove('show');
                }
            }

            updateOverlay();
            window.addEventListener('resize', updateOverlay);
            window.addEventListener('orientationchange', function() {
                setTimeout(updateOverlay, 100);
            });
        })();
    </script>

                    '<b>Safari 또는 Chrome으로 열어주세요.</b>';
            } else {
                el.style.display = 'block';
                el.textContent = '오류: ' + msg + (src ? ' (' + src.split('/').pop() + ':' + line + ')' : '');
            }
        };
        window.addEventListener('unhandledrejection', function(e) {
            var el = document.getElementById('loading-error');
            if (el) { el.style.display = 'block'; el.textContent = '오류: ' + (e.reason?.message || e.reason || '알 수 없는 오류'); }
        });
    </script>

    <script>
        // Wake Lock: 타이머 활성 시 화면/앱 절전 방지
        let _wakeLock = null;
        window.acquireWakeLock = async function() {
            try {
                if ('wakeLock' in navigator) {
                    _wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch(e) { /* 미지원 환경 무시 */ }
        };
        window.releaseWakeLock = function() {
            if (_wakeLock) { _wakeLock.release(); _wakeLock = null; }
        };
        // 화면 다시 켜질 때 재획득
        document.addEventListener('visibilitychange', async () => {
            if (_wakeLock !== null && document.visibilityState === 'visible') {
                try { _wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
            }
        });
    </script>
